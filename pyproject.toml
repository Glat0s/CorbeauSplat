[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "corbeausplat"
version = "0.9.0"
description = "3D Gaussian Splatting pipeline for Windows"
requires-python = "==3.11.*"
dependencies = [
    "PyQt6==6.10.2",
    "requests==2.32.5",
    "urllib3==2.6.3",
    "numpy==2.4.3",
    "send2trash==2.1.0",
    "opencv-python==4.13.0.92",
    "kornia==0.8.2",
    "onnxruntime-gpu==1.24.3",
    "torch==2.8.0+cu129",
    "torchvision==0.23.0+cu129",
    "triton-windows==3.6.0.post26",
]

[project.scripts]
corbeausplat-setup = "app.scripts.setup:main"

[tool.uv]
package = true
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu129"]
index-strategy = "unsafe-best-match"

[tool.bandit]
exclude_dirs = [".venv", "benchmarks", "app/core/vendor"]
skips = ["B101", "B110", "B310", "B404", "B602", "B603", "B606", "B607", "B614"]
# B101 assert, B110 try/except/pass (Triton optional fallbacks), B310 urllib urlretrieve,
# B404 subprocess import, B602/B603 shell=True (app restart/reset — controlled paths),
# B606 execv, B607 partial path, B614 torch.utils.cpp_extension.load (not torch.load)

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008", "UP007", "SIM117"]
