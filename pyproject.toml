[project]
name = "corbeausplat"
version = "0.9.0"
description = "3D Gaussian Splatting pipeline for Windows"
requires-python = ">=3.11"

[project.scripts]
corbeausplat-setup = "app.scripts.setup:main"

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu129"]
index-strategy = "unsafe-best-match"

[tool.bandit]
exclude_dirs = [".venv", "benchmarks", "app/core/vendor"]
skips = ["B101", "B110", "B310", "B404", "B602", "B603", "B606", "B607", "B614"]
# B101 assert, B110 try/except/pass (Triton optional fallbacks), B310 urllib urlretrieve,
# B404 subprocess import, B602/B603 shell=True (app restart/reset — controlled paths),
# B606 execv, B607 partial path, B614 torch.utils.cpp_extension.load (not torch.load)

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM"]
ignore = ["E501", "B008", "UP007", "SIM117"]
